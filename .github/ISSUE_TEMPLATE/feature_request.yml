name: Feature Request
description: Suggest a new feature or improvement for SATISCLI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make SATISCLI better? We'd love to hear it.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? What use case does it address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like and how it should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought about?

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
