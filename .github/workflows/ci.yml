name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (Windows / zig cc)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        shell: pwsh
        run: |
          $version = "0.16.0"
          $url = "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip"
          $zip = "$env:RUNNER_TEMP\zig.zip"
          $dest = "$env:RUNNER_TEMP\zig"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $zigDir = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          echo $zigDir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        run: .\build.bat

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: satiscli-${{ github.sha }}
          path: build\myshell.exe
          if-no-files-found: error
