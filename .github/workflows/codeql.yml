name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC

jobs:
  analyze:
    name: Analyze (C)
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp

      - name: Install Zig
        shell: pwsh
        run: |
          $version = "0.16.0"
          $url = "https://ziglang.org/download/$version/zig-x86_64-windows-$version.zip"
          $zip = "$env:RUNNER_TEMP\zig.zip"
          $dest = "$env:RUNNER_TEMP\zig"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          $zigDir = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          echo $zigDir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build for analysis
        run: .\build.bat

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
